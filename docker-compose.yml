services:
  app:
    build: .
    restart: on-failure
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  # Разовый вход в ВК: docker compose --profile login run --rm --service-ports login
  login:
    build: .
    profiles: ["login"]
    ports:
      - "127.0.0.1:5900:5900"
    volumes:
      - ./data:/data
    command:
      - bash
      - -c
      - |
        Xvfb :99 -screen 0 1280x800x24 &
        sleep 2
        x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 -quiet &
        DISPLAY=:99 vkover-login --profile /data/vk_profile --token-file /data/web_token.json
